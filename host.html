<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Wildlife Detectives Live – Big screen</title>
<link rel="stylesheet" href="style.css">
<style>
/* Big screen: sized for a TV, laptop or iPad in landscape. */
#main{max-width:1100px;margin:0 auto;padding:18px}
#main.wide{max-width:none;padding:14px 20px}
/* lobby and final screens: leave side margins so the jungle vines show, like the single-iPad game */
@media (min-width:900px){#main.wide.decor{max-width:1300px;padding:18px 110px min(18vh,170px)}}
.home{text-align:center;max-width:640px;margin:30px auto}
.home img{width:200px;max-width:60%}
.home h1{font-size:clamp(2rem,4vw,3rem)}
.stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.stats div{background:var(--bg);border-radius:12px;padding:8px 14px;min-width:120px}
.stats b{display:block;font-size:1.6rem}
.warn-box{background:#fbeae7;border:1px solid #e7b3aa;color:#7a2a20;border-radius:12px;padding:10px 14px;margin:10px 0;text-align:left}
/* settings */
.clip{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;background:var(--bg)}
.clip .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.clip .top .name{flex:1;font-weight:700;word-break:break-word}
.clip video{width:100%;max-height:300px;background:#000;border-radius:10px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.opts label{display:block;font-weight:600;margin-bottom:4px}
.radio{display:flex;gap:10px;flex-wrap:wrap}
.radio .chip{flex:1;min-width:220px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.8rem;background:#e3f1e8;color:var(--acc);font-weight:700}
.tag.off{background:#eee;color:#777}
.tag.bad{background:#fbeae7;color:var(--bad)}
/* lobby */
.lobby{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:24px;align-items:start}
@media (max-width:900px){.lobby{grid-template-columns:1fr}}
.join{text-align:center}
.join .code{font:800 clamp(2.6rem,6vw,4.4rem)/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;color:var(--acc)}
.join .url{font-weight:700;word-break:break-all}
.players{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;min-height:120px}
.pname{background:var(--card);border:2px solid var(--acc);border-radius:999px;padding:8px 16px;font-weight:700;font-size:1.15rem}
.bigcount{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:800}
/* game */
.stage{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:18px;align-items:start}
.stage.full{grid-template-columns:1fr}
@media (max-width:900px){.stage{grid-template-columns:1fr}}
.vidbox{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9}
.vidbox video{width:100%;height:100%;object-fit:contain;display:block}
.vidbox .badge{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:6px 14px;font-weight:700}
.vidbox .sound{position:absolute;right:12px;bottom:12px}
.qtitle{font-size:clamp(1.5rem,2.6vw,2.4rem);font-weight:800}
.timer{display:flex;align-items:center;gap:14px;margin:8px 0}
.timer .num{font:800 clamp(2rem,4vw,3.2rem)/1 system-ui;min-width:2.2ch;text-align:center;color:var(--acc)}
.timer .bar{flex:1;height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--acc);transition:width .25s linear}
.answered{font-size:1.2rem;font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tiles .tile{cursor:default;font-size:clamp(1rem,1.6vw,1.4rem)}
.tile .count{margin-left:auto;background:rgba(255,255,255,.25);border-radius:999px;padding:2px 12px}
.blist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.bitem{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700;font-size:clamp(.95rem,1.4vw,1.2rem);display:flex;gap:8px;align-items:center}
.bitem.right{border-color:var(--acc);background:#e3f1e8}
.bitem .count{margin-left:auto;color:var(--mute)}
.board{max-width:760px;margin:0 auto}
.board h1{text-align:center;font-size:clamp(2rem,4vw,3rem)}
.brow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin:10px 0;font-size:clamp(1.1rem,2vw,1.6rem);font-weight:700}
.brow .rk{width:2.2em;text-align:center;font-size:1.2em}
.brow .nm{flex:1}
.brow.p1{background:#fff6dc;border-color:var(--acc2)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:24px 0}
.podium>div{background:var(--card);border:2px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;width:min(22vw,220px);text-align:center;padding:12px 8px;font-weight:800;display:flex;flex-direction:column;justify-content:flex-start;gap:4px}
.podium>div.first{background:#fff6dc;border-color:var(--acc2)}
.podium .n{font-size:clamp(1rem,1.8vw,1.4rem)}
.podium .s{color:var(--mute);font-weight:700}
.podium .m{font-size:2.4rem}
.ctrl{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.final{display:grid;grid-template-columns:1fr minmax(240px,320px);gap:20px;align-items:start}
@media (max-width:900px){.final{grid-template-columns:1fr}}
.qrcard{text-align:center}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="" style="height:34px">
  <span class="title">Wildlife Detectives <span style="color:var(--acc)">Live</span></span>
  <span class="conn" id="conn"><span class="dot" id="dot"></span> <span id="connText">Connecting…</span></span>
  <button class="btn alt sm" id="gear" aria-label="Settings">⚙ Settings</button>
</header>
<main id="main"></main>

<script src="lib/firebase-app-compat.js"></script>
<script src="lib/firebase-auth-compat.js"></script>
<script src="lib/firebase-database-compat.js"></script>
<script src="lib/qrcode.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script src="jungle.js"></script>
<script>
"use strict";
var $ = WD.$, el = WD.el;

/* ======================= local storage (IndexedDB): clips, settings, past games. Videos never leave this device. ======================= */
var idb = null;
function openIDB() {
  return new Promise(function (res, rej) {
    if (!window.indexedDB) { rej(new Error("This browser can't store videos (no IndexedDB).")); return; }
    var q = indexedDB.open("wdlive_v1", 1);
    q.onupgradeneeded = function () { var d = q.result; ["clips", "kv", "games"].forEach(function (s) { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: "id" }); }); };
    q.onsuccess = function () { res(q.result); }; q.onerror = function () { rej(q.error); };
  });
}
/* Writes resolve only once the transaction has committed, so "✓ Saved" is never shown for a failed save. */
function tx(store, mode, fn) {
  return new Promise(function (res, rej) {
    var t = idb.transaction(store, mode), s = t.objectStore(store), out;
    var r = fn(s); if (r) r.onsuccess = function () { out = r.result; };
    t.oncomplete = function () { res(out); }; t.onabort = t.onerror = function () { rej(t.error || new Error("could not save")); };
  });
}
function idbAll(store) { return tx(store, "readonly", function (s) { return s.getAll(); }); }
function idbGet(store, id) { return tx(store, "readonly", function (s) { return s.get(id); }); }
function idbPut(store, v) { return tx(store, "readwrite", function (s) { return s.put(v); }); }
function idbDel(store, id) { return tx(store, "readwrite", function (s) { return s.delete(id); }); }
function idbClear(store) { return tx(store, "readwrite", function (s) { return s.clear(); }); }

/* ======================= state ======================= */
var DEFAULTS = {
  id: "settings", mode: "phones", behaviors: WD.DEF_BEHAVIORS.slice(), species: WD.DEF_SPECIES.slice(),
  secsAnimal: 20, secsBehavior: 30, secsReveal: 8, secsBoard: 6, watchMax: 60, clipsPerGame: 0, shuffle: true, autoAdvance: true,
  pin: "", room: "", playerUrl: ""
};
var cfg = Object.assign({}, DEFAULTS), clips = [], games = [];
var view = "home", unlocked = false, msg = "", armed = null, armT = null;
var fb = null, room = null, connState = { online: false, offset: 0 };
var G = null;          /* the game being played */
var vid = null;        /* one <video> element reused for every clip (iPads limit how many can play) */
var urls = {};         /* clip id -> object URL */

function urlFor(c) { if (!urls[c.id]) urls[c.id] = URL.createObjectURL(c.blob); return urls[c.id]; }
function ready(c) { return c.active !== false && !!c.answer && (c.answer.noAnimal || !!c.answer.species); }
function sortClips() { clips.sort(function (a, b) { return (a.order || 0) - (b.order || 0); }); }
function say(t) { msg = t; var m = $("amsg"); if (m) m.textContent = t; }
function flash(btn, text) { if (!btn) return; var o = btn.dataset.label || btn.textContent; btn.dataset.label = o; btn.textContent = text || "✓ Saved"; btn.classList.add("saved"); setTimeout(function () { btn.textContent = o; btn.classList.remove("saved"); }, 1400); }
function arm(key) { armed = key; clearTimeout(armT); armT = setTimeout(function () { armed = null; render(); }, 4000); render(); }
function saveCfg() { return idbPut("kv", cfg); }

function defaultPlayerUrl() {
  if (/^https?:$/.test(location.protocol) && !WD.isEmulator()) return new URL("index.html", location.href).toString().replace(/index\.html$/, "");
  if (WD.isEmulator()) return new URL("index.html", location.href).toString();
  return WD.DEFAULT_PLAYER_URL;
}
function joinUrl(booth) { return WD.playerUrl(cfg.playerUrl || defaultPlayerUrl(), room, booth); }

/* ======================= Firebase room ======================= */
function rref(p) { return fb.db.ref("rooms/" + room + (p ? "/" + p : "")); }
async function claimRoom() {
  /* Each big-screen device keeps one room code. If the code belongs to someone else (or to this device before its data was cleared), pick a new one. */
  for (var i = 0; i < 6; i++) {
    var code = (i === 0 && cfg.room) ? cfg.room : WD.newRoomCode();
    try {
      await fb.db.ref("rooms/" + code + "/meta").set({ host: fb.uid, mode: cfg.mode, created: WD.serverTs() });
      room = code; if (cfg.room !== code) { cfg.room = code; await saveCfg(); }
      return;
    } catch (e) { if (!/permission/i.test(String(e && (e.code || e.message)))) throw e; }
  }
  throw new Error("Couldn't get a room code. Try again.");
}
async function connectFirebase() {
  try {
    fb = await WD.connect();
    WD.watchConnection(fb.db, function (s) { connState = s; showConn(); });
    await claimRoom();
    showConn(); if (view === "home" || view === "settings") render();
  } catch (e) {
    fb = null; $("connText").textContent = "Not connected: " + WD.errText(e); $("dot").classList.remove("on");
    if (view === "home") render();
  }
}
function showConn() {
  var on = fb && connState.online && room;
  $("dot").classList.toggle("on", !!on);
  $("connText").textContent = !fb ? "Not connected" : !connState.online ? "Offline — reconnecting…" : room ? "Online · room " + room : "Online";
}

/* ======================= views ======================= */
/* Redraws the current view. A redraw of the same view keeps the scroll position (the page used to jump to the top when a
   Settings button redrew the panel, because emptying #main shrinks the page). The position is read BEFORE emptying. */
var lastView = null, lastPhase = null;
function render() {
  var r = $("main"), phase = G ? G.phase : null, same = view === lastView && (view !== "play" || phase === lastPhase), keepY = window.scrollY;
  r.querySelectorAll("video").forEach(function (v) { if (v !== vid) { try { v.pause(); v.removeAttribute("src"); v.load(); } catch (e) {} } });
  r.textContent = ""; r.classList.toggle("wide", view === "play" || view === "lobby" || view === "final");
  WD.decor(view === "home" || view === "lobby" || view === "final");
  $("gear").classList.toggle("hide", !!G);
  ({ home: homeView, settings: settingsView, pin: pinView, lobby: lobbyView, play: playView, final: finalView })[view](r);
  if (same && keepY) window.scrollTo(0, keepY); else if (!same) window.scrollTo(0, 0);
  WD.afterRender(same);
  lastView = view; lastPhase = phase;
}

function homeView(r) {
  var n = clips.filter(ready).length, players = games.reduce(function (t, g) { return t + (g.players || []).length; }, 0);
  var w = el("div", { class: "card home" }, [
    el("img", { src: "logo.png", alt: "Research project logo" }),
    el("h1", {}, ["Wildlife Detectives ", el("span", { style: "color:var(--acc)" }, ["Live"])]),
    el("p", { class: "muted" }, ["Watch real camera-trap videos from the Djéké Triangle together, and race to spot the animal and what it's doing!"]),
    el("div", { class: "stats" }, [
      el("div", {}, [el("b", {}, [String(n)]), "clips ready"]),
      el("div", {}, [el("b", {}, [String(games.length)]), "games played"]),
      el("div", {}, [el("b", {}, [String(players)]), "players so far"])])
  ]);
  if (msg) w.appendChild(el("p", { class: "hint", id: "amsg", style: "white-space:pre-wrap" }, [msg]));
  if (!WD.configured() && !WD.isEmulator()) w.appendChild(el("div", { class: "warn-box" }, ["Firebase isn't set up yet, so phones and iPads can't connect. Follow \"Set up Firebase\" in README.md, then reload this page."]));
  else if (!fb) w.appendChild(el("div", { class: "warn-box" }, ["Not connected to the game server yet. Check the internet connection. (" + $("connText").textContent + ")"]));
  if (!n) w.appendChild(el("div", { class: "warn-box" }, ["No clips are ready. Open ⚙ Settings, add camera-trap videos and set each one's answers."]));
  w.appendChild(el("div", { class: "row", style: "justify-content:center;margin-top:14px" }, [
    el("button", { class: "btn big go", id: "newGame", disabled: !n || !fb || !room, onclick: newGame }, ["▶ New game"])]));
  w.appendChild(el("p", { class: "hint", style: "margin-top:10px" }, [cfg.mode === "booth" ? "Players use the booth iPads (change in Settings)." : "Players join on their own phones by scanning a QR code (change in Settings)."]));
  r.appendChild(w);
}

function pinView(r) {
  var i = el("input", { type: "password", inputmode: "numeric", placeholder: "PIN", "aria-label": "PIN", onkeydown: function (e) { if (e.key === "Enter") go(); } });
  var m = el("p", { class: "hint" }, [""]);
  function go() { if (i.value.trim() === cfg.pin) { unlocked = true; view = "settings"; render(); } else { m.textContent = "Wrong PIN."; i.value = ""; } }
  r.appendChild(el("div", { class: "card", style: "max-width:360px;margin:40px auto" }, [el("h2", {}, ["Settings PIN"]), i, m,
    el("div", { class: "row" }, [el("button", { class: "btn", onclick: go }, ["Unlock"]), el("button", { class: "btn alt", onclick: function () { view = "home"; render(); } }, ["Cancel"])])]));
  setTimeout(function () { i.focus(); }, 50);
}

/* ---------- Settings ---------- */
var draft = null, unsaved = {};
function settingsView(r) {
  r.appendChild(el("div", { class: "row", style: "margin-bottom:12px" }, [el("h2", { style: "flex:1" }, ["Settings"]),
    el("button", { class: "btn alt", onclick: function () { view = "home"; draft = null; render(); } }, ["← Back"])]));
  r.appendChild(el("p", { class: "hint", id: "amsg", style: "white-space:pre-wrap" }, [msg]));

  /* who plays on what */
  var modeCard = el("div", { class: "card" }, [el("h2", {}, ["Players use"]),
    el("div", { class: "radio" }, [
      el("button", { class: "chip" + (cfg.mode === "phones" ? " on" : ""), onclick: function () { setMode("phones"); } }, [el("b", {}, ["Visitors' own phones"]), el("div", { class: "hint" }, ["The big screen shows a QR code. Visitors scan it and play on their phones (mobile data or Wi-Fi)."])]),
      el("button", { class: "chip" + (cfg.mode === "booth" ? " on" : ""), onclick: function () { setMode("booth"); } }, [el("b", {}, ["Booth iPads"]), el("div", { class: "hint" }, ["Players pick up one of your iPads and tap Play. Set each iPad up once (below)."])])])]);
  if (cfg.mode === "booth") {
    if (room) {
      var u = joinUrl(true);
      modeCard.appendChild(el("div", { class: "row", style: "margin-top:12px;align-items:flex-start" }, [
        WD.qrSvg(u, 150),
        el("div", { style: "flex:1;min-width:220px" }, [el("b", {}, ["Set up each booth iPad once:"]),
          el("ol", {}, [el("li", {}, ["On the iPad, scan this QR code with the Camera app (or type the address below into Safari)."]),
            el("li", {}, ["In Safari, tap Share → \"Add to Home Screen\", then open the game from the Home Screen icon."]),
            el("li", {}, ["The iPad then always joins this big screen's games. It shows \"Tap to play\" between games."])]),
          el("p", { class: "url", style: "word-break:break-all;font-size:.9rem" }, [u])])]));
    } else modeCard.appendChild(el("p", { class: "hint" }, ["Connect to the internet to get the booth iPad set-up link."]));
  }
  r.appendChild(modeCard);

  /* clips */
  var up = el("div", { class: "card" }, [el("h2", {}, ["Camera-trap clips"]),
    el("p", { class: "hint" }, ["Videos are stored only on this device (they're never uploaded). Short clips (10–40 s) work best. MP4 (H.264) plays everywhere."])]);
  var inp = el("input", { type: "file", accept: "video/mp4,video/quicktime,video/x-m4v,video/webm,video/*", multiple: true, onchange: function () { addFiles([].slice.call(this.files)); this.value = ""; } });
  up.appendChild(inp);
  if (!clips.length) up.appendChild(el("p", { class: "muted" }, ["No clips yet."]));
  var gone = function (c) { var a = c.answer; if (!a) return []; return (a.noAnimal ? [] : [a.species]).filter(function (s) { return s && !WD.inn(cfg.species, s); }).concat((a.behaviors || []).filter(function (b) { return !WD.inn(cfg.behaviors, b); })); };
  clips.forEach(function (c, idx) {
    var a = c.answer, st = !a ? el("span", { class: "tag bad" }, ["⚠ answers not set"]) : c.active === false ? el("span", { class: "tag off" }, ["not in game"]) : el("span", { class: "tag" }, ["ready"]);
    var row = el("div", { class: "clip" }, [el("div", { class: "top" }, [
      el("span", { class: "name" }, [(idx + 1) + ". " + c.name]), st,
      el("button", { class: "btn sm alt", disabled: idx === 0, "aria-label": "Move up", onclick: function () { moveClip(idx, -1); } }, ["↑"]),
      el("button", { class: "btn sm alt", disabled: idx === clips.length - 1, "aria-label": "Move down", onclick: function () { moveClip(idx, 1); } }, ["↓"]),
      el("button", { class: "btn sm" + (draft && draft.id === c.id ? "" : " alt"), onclick: function () { openDraft(c); } }, [a ? "Answers ✔" : "Set answers"]),
      el("button", { class: "btn sm alt", onclick: async function () { c.active = c.active === false; await idbPut("clips", c); render(); } }, [c.active === false ? "Not in game" : "In game ✔"]),
      el("button", { class: "btn sm " + (armed === "rm" + c.id ? "armed" : "alt"), onclick: async function () {
        if (armed !== "rm" + c.id) { arm("rm" + c.id); return; }
        armed = null; await idbDel("clips", c.id); clips = clips.filter(function (x) { return x !== c; }); if (urls[c.id]) { URL.revokeObjectURL(urls[c.id]); delete urls[c.id]; } say("Removed " + c.name + "."); render(); } }, [armed === "rm" + c.id ? "Tap again to remove" : "Remove"])])]);
    if (a) row.appendChild(el("p", { class: "hint", style: "margin:6px 0 0" }, [(a.noAnimal ? "No animal visible" : a.species) + (a.noAnimal ? "" : " · " + ((a.behaviors || []).join(", ") || "no behaviors"))]));
    var g = gone(c); if (g.length) row.appendChild(el("p", { class: "hint", style: "color:var(--bad)" }, ["⚠ This clip's answers use " + g.map(function (x) { return "“" + x + "”"; }).join(", ") + ", which " + (g.length > 1 ? "are" : "is") + " no longer in the choice lists. Re-check its answers."]));
    if (draft && draft.id === c.id) row.appendChild(answerEditor(c));
    up.appendChild(row);
  });
  r.appendChild(up);

  /* game options */
  function num(key, label, min, max, hint) {
    return el("div", {}, [el("label", { for: "o_" + key }, [label]), el("input", { type: "number", id: "o_" + key, min: min, max: max, value: cfg[key] }), hint ? el("div", { class: "hint" }, [hint]) : null]);
  }
  function chk(key, label) { return el("label", { style: "display:flex;gap:8px;align-items:center;font-weight:600" }, [el("input", { type: "checkbox", id: "o_" + key, checked: !!cfg[key] }), label]); }
  r.appendChild(el("div", { class: "card" }, [el("h2", {}, ["Game options"]),
    el("div", { class: "opts" }, [
      num("clipsPerGame", "Clips per game", 0, 50, "0 = all ready clips"),
      num("secsAnimal", "Seconds for “Which animal?”", 5, 120),
      num("secsBehavior", "Seconds for “What is it doing?”", 5, 180),
      num("watchMax", "Longest time a clip plays first (s)", 5, 300, "Questions open when the clip ends, or after this long"),
      num("secsReveal", "Seconds showing the answer", 3, 60),
      num("secsBoard", "Seconds showing the leaderboard", 2, 60)]),
    el("div", { class: "row", style: "margin-top:12px" }, [chk("shuffle", "Shuffle clip order each game"), chk("autoAdvance", "Move on automatically (otherwise press Next ▶)")]),
    el("div", { class: "row", style: "margin-top:12px" }, [el("button", { class: "btn", onclick: saveOptions }, ["Save"])])]));

  /* choice lists */
  function listCard(key, title, hint, defs) {
    var ta = el("textarea", { "aria-label": title, oninput: function () { unsaved[key] = ta.value; } });
    ta.value = unsaved[key] != null ? unsaved[key] : cfg[key].join("\n");
    return el("div", { class: "card" }, [el("h2", {}, [title]), el("p", { class: "hint" }, [hint]), ta,
      el("div", { class: "row", style: "margin-top:8px" }, [
        el("button", { class: "btn", id: "save_" + key, onclick: async function () {

  var ranks = rankAll(), res = {};

  rref("results").set(res).catch(function () {});

}
function rankAll() {

}
function sorted() { var ranks = rankAll(); return Object.keys(G.names).sort(function (a, b) { return G.scores[b] - G.scores[a] || G.names[a].localeCompare(G.names[b]); }).map(function (u) { return { uid: u, name: G.names[u], score: G.scores[u], rank: ranks[u] }; }); }

async function finish() {
  check();
  var list = sorted();
  await setGame({ phase: "final", clip: G.clips.length - 1, open: false, top: list.slice(0, 3).map(function (p) { return { name: p.name, score: p.score }; }) });
  var rec = { id: G.id, started: G.started, ended: Date.now(), mode: cfg.mode, questions: G.questions || 0, maxScore: G.maxScore || 0, clips: G.clips.map(function (c) { return c.name; }),
    players: list.map(function (p) { return { name: p.name, score: p.score, rank: p.rank, answered: G.answered[p.uid] || 0 }; }), rows: G.rows };
  try { await idbPut("games", rec); games.push(rec); } catch (e) { say("Couldn't save this game's results on this device: " + e.message); }

function stopVideo() { if (vid) { vid.onended = null; vid.pause(); vid.loop = false; } }
async function endGame() {

    else s.appendChild(el("div", { class: "blist" }, q.choices.map(function (x) { return el("div", { class: "bitem" }, [x]); })));

  } else if (ph === "reveal") {
    var R = G.reveal, s2 = el("div", { class: "card popin" }, [el("div", { class: "qtitle" }, [el("span", { class: "verdict" }, [R.noAnimal ? "No animal this time!" : "It's a " + R.correct + "!"])])]);
    s2.appendChild(el("div", { class: "tiles" }, R.choices.map(function (x, k) { var t = WD.TILES[k];
      return el("div", { class: "tile" + (x === R.correct ? " right" : " dim"), style: { background: t.color } }, [el("span", { class: "shape" }, [x === R.correct ? "✓" : t.shape]), x, el("span", { class: "count" }, [String(R.counts.animal[x] || 0)])]); })));
    if (!R.noAnimal) {
      s2.appendChild(el("p", { style: "margin-top:14px;font-weight:800;font-size:1.2rem" }, ["What it's doing:"]));
      s2.appendChild(el("div", { class: "blist" }, cfg.behaviors.map(function (x) { var ok = WD.inn(R.behaviors, x);
        return el("div", { class: "bitem" + (ok ? " right" : "") }, [ok ? "✓" : "", x, el("span", { class: "count" }, [String(R.counts.behavior[x] || 0)])]); })));
      s2.appendChild(el("p", { class: "hint" }, ["Numbers show how many players picked each answer."]));
    }

}
function controls() {

    el("button", { class: "btn alt " + (armed === "end" ? "armed" : ""), onclick: function () { if (armed !== "end") { arm("end"); return; } armed = null; endGame(); } }, [armed === "end" ? "Tap again to end the game" : "End game"]),
    el("button", { class: "btn big", onclick: function () { if (G && G.next) G.next(); } }, [G.phase === "question" ? "Close question ▶" : "Next ▶"])]);
}
function boardView() {

  list.forEach(function (p) { w.appendChild(el("div", { class: "brow popin" + (p.rank === 1 ? " p1" : "") }, [el("span", { class: "rk" }, [p.rank === 1 ? "🥇" : p.rank === 2 ? "🥈" : p.rank === 3 ? "🥉" : "#" + p.rank]), el("span", { class: "nm" }, [p.name]), el("span", {}, [String(p.score)])])); });

function finalView(r) {

  r.appendChild(el("div", { class: "ctrl" }, [el("button", { class: "btn alt", onclick: endGame }, ["Done"]), el("button", { class: "btn big go", onclick: async function () { await endGame(); newGame(); } }, ["▶ Play again"])]));
}

/* ======================= start-up ======================= */
$("gear").onclick = function () { if (G) return; draft = null; view = cfg.pin && !unlocked ? "pin" : "settings"; render(); };
document.addEventListener("keydown", function (e) { if (G && G.next && (e.key === " " || e.key === "ArrowRight") && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { e.preventDefault(); G.next(); } });
(async function () {
